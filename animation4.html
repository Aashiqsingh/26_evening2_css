<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-image: url('https://i.pinimg.com/originals/1f/aa/d0/1faad0965fd2374bb8233733b2bdfd43.gif');
        background-size: cover;
    }
    .b1{
        position: absolute;
        bottom: 0;

        animation-name: balloon1;
        animation-duration: 4s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
    }
    @keyframes balloon1{
        from{
            bottom: 0;
            left: 0;
        }
        to{
            bottom: 500px;
            left: 100px;
        }
    }
    .b2{
        position: absolute;
        bottom: 0;
        left: 300px;

        animation-name: balloon2;
        animation-duration: 4s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;

        animation-delay: 2s;
    }
    @keyframes balloon2{
        from{
            bottom: 0;
            left: 300px;
        }
        to{
            bottom: 500px;
            left: 400px;
        }
    }
</style>
<body>


    <div class="b1">
        <img src="https://www.freeiconspng.com/uploads/hot-air-balloon-transparent-png-4.png" height="150" width="150" alt="">
    </div>

    <div class="b2">
        <img src="https://www.freeiconspng.com/uploads/hot-air-balloon-transparent-png-4.png" height="150" width="150" alt="">
    </div>

    
</body>
</html>
