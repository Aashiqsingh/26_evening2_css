<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        /* padding: 0; */
        box-sizing: border-box;
    }
    .box{
        height: 300px;
        width: 300px;
        border: 1px solid rgba(0, 0, 0, 0.174);

        margin: 100px 400px;
        border-radius: 6px;
        /* text-align: center; */
        padding-left: 20px;
    }
    .txt{
        height: 40px;
        width: 92%;
        padding-left: 14px;
        margin-top: 3px;
        border: 1px solid rgba(0, 0, 0, 0.174);
        border-radius: 6px;
        outline: none;
    }
    .btn{
        height: 45px;
        margin-top: 4px;
        width: 92%;
        font-size: 20px;
        color: white;
        background-color: aqua;
        border: none;
        border-radius: 6px;
        margin-bottom: 30px;
    }
    .btn:hover{
        background-color: black;
    }
    a{
        color: blue;
        margin-left: 60px;
    }
</style>
<body>

    <div class="box">
        <h1>Member Login</h1>
        <input type="text" placeholder="UserName" class="txt">
        <input type="text" placeholder="Password" class="txt">
        <input type="Submit" class="btn" value="Login">

        <a href="">Forget Password..?</a>
    </div>

    
</body>
</html>
