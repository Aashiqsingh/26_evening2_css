<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        background-color: red;
        height: 300px;
        width: 300px;
        background-color: teal;
        color: white;

        /* text formatting */

        font-size: xx-large;
        font-size: 22px;
        font-size: 20px;

        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-family: arial;
        font-weight: 900;
        font-weight: 100;
        font-weight: bolder;

        font-style: italic;
        font-style: oblique;


        /* text */

        text-align: center;
        text-align: right;
        text-align: justify;
        text-decoration: underline;
        text-decoration: line-through;
        text-decoration: overline;

        /* text-decoration: underline solid red;
        text-decoration: underline dotted red;
        text-decoration: underline dashed red;
        text-decoration: underline wavy red;
        text-decoration: underline double pink;
        text-decoration: yellow dashed underline;
        text-decoration: yellow dashed overline;
        text-decoration: yellow dotted line-through; */

        text-transform: capitalize;
        text-transform: uppercase;
        text-transform: lowercase;


        text-shadow: 2px 2px 2px black;
        text-shadow: 2px 2px 1px ;

        /* 2px : left or right
            2px : top or bottom
            2px : blur
            black : color
        */

        /* text-shadow: -2px -2px 0px blue; */
        /* text-shadow: -2px -2px 0px blue , 2px 2px 0px red; */


        text-shadow: 3px 2px 4px  blue;



    }
</style>
<body>
    
    <div class="box">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Provident modi molestias, ex sit nobis natus voluptate consequuntur impedit pariatur aut perferendis ut porro voluptates omnis minus totam quidem minima adipisci?
    </div>

</body>
</html>
